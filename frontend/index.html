<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center py-12 px-4 sm:px-6">
    
    <!-- Header -->
    <div class="max-w-3xl w-full text-center mb-10">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 text-xs font-medium mb-4 border border-blue-500/20">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Powered by FastAPI, Gemini & Tavily
        </div>
        <h1 class="text-4xl font-extrabold tracking-tight sm:text-5xl text-white">
            AI Research Assistant
        </h1>
        <p class="mt-3 text-slate-400 text-lg">
            Enter any topic to synthesize real-time web research and get structured reports instantly.
        </p>
    </div>

    <!-- Search Form -->
    <div class="max-w-2xl w-full mb-10">
        <form id="research-form" class="relative flex items-center shadow-2xl rounded-2xl overflow-hidden border border-slate-800 bg-slate-900/80 backdrop-blur-md">
            <div class="pl-5 text-slate-400">
                <i data-lucide="search" class="w-5 h-5"></i>
            </div>
            <input
                type="text"
                id="topic-input"
                placeholder="e.g., Latest developments in Agentic AI..."
                class="w-full py-4 px-4 bg-transparent text-white placeholder-slate-500 focus:outline-none text-base"
                required
            />
            <button
                type="submit"
                id="submit-btn"
                class="m-2 px-6 py-3 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-medium rounded-xl transition-all flex items-center gap-2 cursor-pointer"
            >
                <span id="btn-text">Research</span>
            </button>
        </form>
    </div>

    <!-- Error Message -->
    <div id="error-box" class="max-w-2xl w-full mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm hidden"></div>

    <!-- Loading State -->
    <div id="loading-box" class="max-w-2xl w-full text-center py-16 space-y-4 hidden">
        <i data-lucide="loader-2" class="w-10 h-10 animate-spin text-blue-500 mx-auto"></i>
        <p class="text-slate-400 font-medium">Scouring the web, evaluating sources, and synthesizing report...</p>
    </div>

    <!-- Results Section -->
    <div id="results-section" class="max-w-3xl w-full space-y-8 hidden">
        
        <!-- Key Findings Card -->
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i data-lucide="book-open" class="w-5 h-5 text-blue-400"></i> Key Findings
                </h3>
                <button
                    id="copy-btn"
                    class="flex items-center gap-1.5 text-xs font-medium text-slate-400 hover:text-white bg-slate-800/60 hover:bg-slate-800 px-3 py-1.5 rounded-lg transition-all cursor-pointer"
                >
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                    <span id="copy-text">Copy Summary</span>
                </button>
            </div>
            <ul id="key-findings-list" class="space-y-3"></ul>
        </div>

        <!-- Detailed Summary Card -->
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
            <h3 class="text-lg font-semibold text-white mb-4">Executive Summary & Analysis</h3>
            <div id="final-summary-content" class="text-slate-300 text-sm leading-relaxed whitespace-pre-line bg-slate-950/40 p-4 rounded-xl border border-slate-800/50"></div>
        </div>

        <!-- Sources Pills Card -->
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Verified Sources</h3>
            <div id="sources-container" class="flex flex-wrap gap-2"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
